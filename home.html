<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omar'y – 1 Day Left</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #FF7A00;
            font-size: 2.5rem;
            margin-top: 60px;
        }

        .circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #FF7A00;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            font-size: 2rem;
            color: #FF7A00;
            box-shadow: 0 0 15px rgba(255, 122, 0, 0.5);
        }

        .message {
            width: 85%;
            margin: 30px auto;
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 1rem;
            background: #FF7A00;
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 122, 0, 0.4);
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background: #111;
            padding: 20px;
            border-radius: 15px;
            width: 80%;
            color: #FF7A00;
            font-size: 1.1rem;
            box-shadow: 0 0 12px rgba(255, 122, 0, 0.5);
            animation: fadeIn 1s;
        }

        .footer {
            margin-top: 40px;
            color: #FF7A00;
            font-size: 0.9rem;
            opacity: 0.8;
            padding-bottom: 30px;
        }
    </style>
</head>
<body>
    <h1>1 jour restant… 🎂</h1>

    <div class="circle">1</div>

    <div class="message">
        Chaque jour qui passe… je me rends compte que je t’aime plus. <br>
        Attends ton anniversaire… j’ai une surprise pour toi Omar’y 🧡
    </div>

    <button onclick="showPopup()">Taper pour un message</button>

    <div class="popup" id="popup">
        <div class="popup-content">
            Le meilleur reste à venir… 1 jour et je te fête à ma façon 🔥🧡
            "Ohibok"
        </div>
    </div>

    <div class="footer">Made with love by your wifey🧡</div>

    <script>
        function showPopup() {
            document.getElementById('popup').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('popup').style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
